<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Research talk replay — HKUST(GZ) Frontier AI Club">
  <meta name="theme-color" content="#041536">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'self' https://drive.google.com https://docs.google.com">
  <title>Talk | HKUST(GZ) Frontier AI Club</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="page-talk" data-page="talk">
<div class="scroll-progress" aria-hidden="true"><span></span></div>
<div class="cursor-glow" aria-hidden="true"></div>
<div data-site-header></div>
<main>
  <section class="talk-room">
    <div class="talk-room-copy">
      <div class="eyebrow"><span class="eyebrow-pulse"></span><span data-talk-kicker></span></div>
      <h1 data-talk-title></h1>
      <p class="talk-lead" data-talk-abstract></p>
      <dl class="talk-facts">
        <div><dt data-i18n="presenterLabel"></dt><dd data-talk-presenter></dd></div>
        <div><dt data-i18n="affiliationLabel"></dt><dd data-talk-affiliation></dd></div>
        <div><dt data-i18n="talkDateLabel"></dt><dd data-talk-date></dd></div>
      </dl>
      <div class="tag-list light-tags" data-talk-tags></div>
      <p class="talk-open-note" data-talk-open></p>
      <div class="talk-room-actions">
        <button type="button" class="btn btn-primary" data-talk-dock-page><span data-i18n="dockVideo"></span></button>
        <a class="btn btn-ghost" href="talks.html"><span data-i18n="navTalks"></span></a>
      </div>
    </div>
    <div class="talk-video-shell" data-talk-video></div>
    <article class="talk-bio-panel">
      <div class="bio-label" data-i18n="speakerBioLabel"></div>
      <p data-talk-bio></p>
      <p class="edit-hint" data-i18n="editTalkHint"></p>
    </article>
  </section>
</main>
<button class="back-to-top" aria-label="Back to top">↑</button>
<div data-site-footer></div>
<script type="module" src="js/site.js"></script>
</body>
</html>
